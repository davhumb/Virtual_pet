function wend(){if(!wdrag)return;wdrag=null;calcPeaks();stSave();draw();ctl()}
$('pzw').addEventListener('pointerup',wend);$('pzw').addEventListener('pointercancel',wend);
$('pze').onclick=()=>{if(!P.buf)return;init();const len=P.buf.duration,s=ac.createBufferSource(),g=ac.createGain(),t=ac.currentTime+.03,d=(P.b-P.a)*len,v=P.vol*.94*(P.normOn===false?1:P.ng||1),fo=Math.min(P.fade/1000,d*.2);s.buffer=P.buf;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.003);g.gain.setValueAtTime(v,t+d-fo);g.gain.linearRampToValueAtTime(0,t+d);s.connect(g);g.connect(G.mst);s.start(t,P.a*len);s.stop(t+d+.01)};
$('pzi').onclick=()=>$('pzfile').click();
$('pzfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;init();$('pzn').textContent='Lecture du fichier...';
try{const raw=await f.arrayBuffer();P.raw=raw;P.name=f.name;P.buf=null;P.rev=null;await decode();if(!P.buf)return;P.slots=ident();P.sel=-1;P.a=0;P.b=1;calcPeaks();await put('raw',raw);stSave();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}draw();ctl()}catch(_){$('pzn').textContent='Fichier audio illisible'}};
ob.onclick=()=>{init();pnl.hidden=false;if(P.raw&&!P.buf&&!P.dec){P.dec=1;decode().then(()=>{P.dec=0})}ctl();draw()};
$('pzx').onclick=()=>{pnl.hidden=true};
setInterval(()=>{if(!playing)P.manual=false;if(P.raw&&!P.buf&&ac&&!P.dec){P.dec=1;decode().then(()=>{P.dec=0})}
if(!P.follow||!P.buf)return;if(playing&&!P.on&&!P.manual){pzStart();P.auto=true}else if(!playing&&P.on&&P.auto)pzStop()},120);
(async()=>{const raw=await get('raw');if(!raw)return;const st=await get('st');P.raw=raw;if(st){['a','b','n','bars','sync','follow','vol','pitch','filt','fade','slots','name'].forEach(k=>{if(st[k]!==undefined)P[k]=st[k]})}if(P.slots.length!==P.n)P.slots=ident();ctl();draw()})();
ctl();draw();requestAnimationFrame(frame);
})();
