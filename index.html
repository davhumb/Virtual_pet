<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emcee Battle — 90's Edition</title>
<style>
  :root {
    --ink: #0A0A0A;
    --paper: #F0EBE0;
    --gold: #D4A017;
    --brick: #B33A1E;
    --moss: #4A5D3A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 1.1rem 1.4rem;
    border-bottom: 3px solid var(--gold);
  }
  .header-tag {
    font-family: -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif;
    font-weight: 900;
    font-stretch: condensed;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    color: var(--paper);
  }
  .header-era {
    font-size: 0.75rem;
    color: var(--gold);
    font-weight: 500;
  }

  .duel {
    flex: 1;
    display: flex;
    flex-direction: row;
    position: relative;
    min-height: 0;
  }
  @media (max-width: 720px) {
    .duel { flex-direction: column; }
  }

  .side {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.2rem;
    border: none;
    cursor: pointer;
    font-family: inherit;
    color: var(--paper);
    background: #141412;
    transition: background 160ms ease, transform 160ms ease;
    overflow: hidden;
  }
  .side--left { border-right: 2px solid var(--gold); }
  @media (max-width: 720px) {
    .side--left { border-right: none; border-bottom: 2px solid var(--gold); }
  }
  .side:hover { background: #1c1b17; }
  .side:active { transform: scale(0.98); }
  .side:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }

  .side--flash { background: var(--gold) !important; }
  .side--flash .name { color: var(--ink); }
  .side--flash .crown, .side--flash .challenger-tag { color: var(--ink); }

  .wall-texture {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.4;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.03) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.03) 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(255,255,255,0.02) 0%, transparent 50%);
  }

  .name {
    font-family: -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif;
    font-weight: 900;
    font-stretch: condensed;
    font-size: clamp(1.6rem, 6vw, 3.4rem);
    text-align: center;
    line-height: 1.05;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.4);
    z-index: 1;
    max-width: 90%;
  }

  .crown {
    position: absolute; top: 1rem; left: 1.2rem;
    font-size: 0.7rem; color: var(--gold); font-weight: 700; z-index: 1;
  }
  .challenger-tag {
    position: absolute; top: 1rem; right: 1.2rem;
    font-size: 0.7rem; color: var(--brick); font-weight: 700; z-index: 1;
  }

  .vs-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    pointer-events: none;
  }

  .vs {
    font-family: -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif;
    font-weight: 900;
    font-stretch: condensed;
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--brick);
    background: var(--ink);
    border: 3px solid var(--brick);
    border-radius: 50%;
    width: 4.2rem; height: 4.2rem;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-6deg);
  }
  .round-count {
    font-size: 0.7rem;
    color: var(--paper);
    background: var(--ink);
    padding: 0.15rem 0.5rem;
    border: 1px solid var(--moss);
  }

  .winner-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    position: relative;
    background: #141412;
    padding: 2rem;
    text-align: center;
  }
  .winner-label { color: var(--gold); font-size: 0.85rem; font-weight: 700; z-index: 1; }
  .winner-name {
    font-family: -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif;
    font-weight: 900;
    font-stretch: condensed;
    font-size: clamp(2.2rem, 9vw, 5rem);
    text-transform: uppercase;
    color: var(--paper);
    text-shadow: 4px 4px 0 var(--brick);
    margin: 0;
    z-index: 1;
    line-height: 1.05;
  }
  .winner-stat { color: var(--moss); font-size: 1rem; font-weight: 500; z-index: 1; filter: brightness(1.6); }
  .replay-btn {
    margin-top: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 0.85rem 1.8rem;
    cursor: pointer;
    z-index: 1;
    transition: transform 120ms ease;
  }
  .replay-btn:hover { transform: translateY(-2px); }
  .replay-btn:active { transform: translateY(0); }
  .replay-btn:focus-visible { outline: 3px solid var(--brick); outline-offset: 2px; }

  .footer {
    text-align: center;
    padding: 0.7rem;
    font-size: 0.7rem;
    color: #555;
    border-top: 1px solid #262626;
  }

  @media (prefers-reduced-motion: reduce) {
    .side, .replay-btn { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div style="padding:2rem;text-align:center;font-family:sans-serif;color:#F0EBE0;">Chargement...</div>
</div>

<script>
window.addEventListener("error", function (e) {
  var app = document.getElementById("app");
  if (app) {
    app.innerHTML = '<div style="padding:2rem;text-align:center;font-family:sans-serif;color:#F0EBE0;">' +
      '<p>Un problème est survenu au chargement.</p>' +
      '<p style="color:#B33A1E;font-size:0.8rem;">' + (e.message || "erreur inconnue") + '</p>' +
      '</div>';
  }
});
</script>

<script>
// ---------------------------------------------------------------------------
// BASE DE DONNÉES — emcees / crews 90s (rien post-98), tirage aléatoire
// ---------------------------------------------------------------------------
const EMCEES = [
  "Tupac Shakur", "The Notorious B.I.G.", "Nas", "Jay-Z", "Rakim",
  "KRS-One", "Big Daddy Kane", "Chuck D", "Method Man", "Redman",
  "Big L", "Big Pun", "Q-Tip", "Black Thought", "MC Lyte",
  "Queen Latifah", "Lauryn Hill", "Common", "Mos Def", "Talib Kweli",
  "Ghostface Killah", "RZA", "GZA", "Ol' Dirty Bastard", "Raekwon",
  "Snoop Dogg", "Ice Cube", "Scarface", "DMX", "Busta Rhymes",
  "André 3000", "Big Boi", "MC Ren", "Slick Rick",
  "Kool G Rap", "Kurupt", "Twista", "Krayzie Bone", "LL Cool J",
  "Ice-T", "Warren G", "E-40", "Too $hort", "Master P",
  "Xzibit", "Canibus", "Prodigy (Mobb Deep)", "Havoc (Mobb Deep)", "Fat Joe",
  "AZ", "Cormega", "Jadakiss", "Styles P", "Sheek Louch",
  "Inspectah Deck", "Masta Killa", "U-God", "Cappadonna", "Kool Keith",
  "Del the Funky Homosapien", "Ras Kass", "MC Eiht", "Spice 1",
  "Bushwick Bill", "Willie D", "Da Brat", "Foxy Brown", "Lil' Kim",
  "Eve", "Lady of Rage", "Yo-Yo", "Bahamadia",
  "Pharoahe Monch", "Large Professor", "Guru", "Grand Puba", "Sadat X",
  "Phife Dawg", "Doug E. Fresh", "Special Ed", "Diamond D",
  "Lord Finesse", "AG", "O.C.",
  "MF DOOM", "Ad-Rock", "Mike D", "MCA",
  "Dr. Dre", "Skoob (Das EFX)", "Krazy Drayz (Das EFX)",
  "Buckshot (Black Moon)", "5FT (Black Moon)", "Eminem",
  "Tek (Smif-N-Wessun)", "Steele (Smif-N-Wessun)",
  "Rockness (Heltah Skelter)", "Ruck (Heltah Skelter)",
  "OGC (Louieville Sluggah)", "OGC (Starang Wondah)", "OGC (Top Dog)",
].map(s => s.trim()).filter(Boolean);

const POOL = [...new Set(EMCEES)];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------------------------------------------------------------------------
// État du jeu
// ---------------------------------------------------------------------------
let state = {};

function startGame() {
  const shuffled = shuffle(POOL);
  state = {
    queue: shuffled.slice(2),
    champion: shuffled[0],
    challenger: shuffled[1],
    round: 1,
    wins: 0,
    flash: null,
    finished: false,
  };
  render();
}

function pick(side) {
  if (state.flash) return;
  const winnerName = side === "left" ? state.champion : state.challenger;
  state.flash = side;
  render();

  setTimeout(() => {
    state.wins += 1;
    if (state.queue.length === 0) {
      state.champion = winnerName;
      state.finished = true;
      state.flash = null;
      render();
      return;
    }
    const [next, ...rest] = state.queue;
    state.champion = winnerName;
    state.challenger = next;
    state.queue = rest;
    state.round += 1;
    state.flash = null;
    render();
  }, 260);
}

// ---------------------------------------------------------------------------
// Rendu
// ---------------------------------------------------------------------------
const WALL_SVG = '<div class="wall-texture"></div>';

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  const app = document.getElementById("app");

  let body;
  if (!state.finished) {
    body = `
      <div class="duel">
        <button class="side side--left ${state.flash === "left" ? "side--flash" : ""}" id="pick-left" aria-label="Choisir ${escapeHtml(state.champion)}">
          ${WALL_SVG}
          ${state.round > 1 ? '<span class="crown">champion</span>' : ""}
          <span class="name">${escapeHtml(state.champion)}</span>
        </button>

        <div class="vs-wrap">
          <span class="vs">VS</span>
          <span class="round-count">round ${state.round}</span>
        </div>

        <button class="side side--right ${state.flash === "right" ? "side--flash" : ""}" id="pick-right" aria-label="Choisir ${escapeHtml(state.challenger)}">
          ${WALL_SVG}
          <span class="challenger-tag">challenger</span>
          <span class="name">${escapeHtml(state.challenger)}</span>
        </button>
      </div>
    `;
  } else {
    body = `
      <div class="winner-screen">
        ${WALL_SVG}
        <span class="winner-label">le dernier debout</span>
        <h1 class="winner-name">${escapeHtml(state.champion)}</h1>
        <p class="winner-stat">${state.wins} victoire${state.wins > 1 ? "s" : ""} d'affilée</p>
        <button class="replay-btn" id="replay">Relancer une battle</button>
      </div>
    `;
  }

  app.innerHTML = `
    <header class="header">
      <span class="header-tag">emcee battle</span>
      <span class="header-era">90's edition</span>
    </header>
    ${body}
    <footer class="footer">
      <span>${POOL.length} emcees dans la base</span>
    </footer>
  `;

  if (!state.finished) {
    document.getElementById("pick-left").addEventListener("click", () => pick("left"));
    document.getElementById("pick-right").addEventListener("click", () => pick("right"));
  } else {
    document.getElementById("replay").addEventListener("click", startGame);
  }
}

startGame();
</script>
</body>
</html>
