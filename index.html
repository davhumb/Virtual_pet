<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Celluloïd Beats</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efe9;--fg:#141414;--mu:#7a776f;--ln:#d5d1c7;--ac:#e23b1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b0c;--fg:#e8e6e1;--mu:#7d7b75;--ln:#27272b;--ac:#ff4d2e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0b0c;--fg:#e8e6e1;--mu:#7d7b75;--ln:#27272b;--ac:#ff4d2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(120% 55% at 100% 0%,color-mix(in srgb,#bf5af2 24%,var(--bg)),transparent 65%),radial-gradient(110% 50% at 0% 100%,color-mix(in srgb,#00c7be 20%,var(--bg)),transparent 65%),var(--bg);background-attachment:fixed;min-height:100%}*{box-sizing:border-box}
body{margin:0 auto;color:var(--fg);font:12px 'Fragment Mono',ui-monospace,monospace;padding:12px;max-width:760px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:15px;letter-spacing:.2em;margin:0;background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#32ade6,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent}h3{margin:0;grid-column:1/-1;letter-spacing:.15em;color:var(--c)}
button,select,input[type=number]{font:inherit;color:var(--fg);background:none;border:1px solid var(--ln);padding:7px 10px;border-radius:0}
button.on{background:var(--fg);color:var(--bg)}
.tr{margin-bottom:6px;padding-left:6px;border-left:3px solid transparent}.tr.sel{border-color:var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 60%)}
.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}.h button{padding:2px 8px;font-size:11px}
.h .nm{border:0;padding:0;font-weight:700;letter-spacing:.1em;color:var(--c)}
.s{display:grid;grid-template-columns:repeat(16,1fr);gap:2px}
.st{height:30px;padding:0;background:linear-gradient(var(--c),var(--c)) bottom/100% calc(var(--v)*100%) no-repeat,color-mix(in srgb,var(--c) 10%,transparent)}
.st:nth-child(4n+1){border-left-color:var(--mu)}.st.ph{outline:1px solid var(--fg)}
.p{border-top:1px solid var(--ln);padding:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
label{display:flex;flex-direction:column;gap:3px;color:var(--mu)}input[type=range]{width:100%;accent-color:var(--ac)}
.w{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}#ex{background:linear-gradient(90deg,#ff3b30,#ff9500,#bf5af2);color:#fff;border-color:transparent;font-weight:700}#pl{background:var(--ac);color:#fff;border-color:var(--ac)}#add{border-style:dashed;color:var(--mu)}.btn{position:relative;display:inline-block;overflow:hidden;border:1px solid var(--ln);padding:7px 10px}.h .btn{padding:2px 8px;font-size:11px}.btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}#pads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}#pads button{height:64px;border:0;background:var(--c);color:#000;font-weight:700;touch-action:none;opacity:.85}#pads button:active{opacity:1;transform:scale(.96)}canvas{grid-column:1/-1;width:100%;height:48px;display:block;border:1px solid var(--ln)}#tp input[type=range]{accent-color:var(--c)}
</style></head><body>
<header><h1>CELLULOÏD BEATS</h1><div><input id=bpm type=number min=50 max=220 value=90 style="width:68px"> <button id=pl>▶</button></div></header>
<div id=g></div><button id=add style="width:100%;margin:2px 0 8px">+ Piste sample</button><div class=p style="grid-template-columns:1fr auto auto;padding:8px 0;align-items:center"><small style="color:var(--mu)">PADS · REC grave sur la grille pendant la lecture</small><button id=rec>● REC</button><button id=midi>MIDI</button></div><div id=pads></div><section class=p id=tp></section><section class=p id=mp></section>
<section class=p><label>Mesures<select id=bars><option>1<option selected>2<option>4<option>8</select></label>
<label>Queue FX (+2,5 s)<input id=tail type=checkbox checked></label>
<button id=ex class=w>Exporter .zip : mix + stems WAV 24 bits</button><small id=ms class=w style="color:var(--mu)">Tape un pas : off → doux → moyen → fort</small></section>
<script>
const $=s=>document.querySelector(s),L=[0,.45,.75,1],COL=['#ff3b30','#ff9500','#ffd60a','#34c759','#00c7be','#32ade6','#5e5ce6','#bf5af2','#ff2d92'];
const S={bpm:90,swing:.18,hum:.25,dly:.18,rev:.18,lp:1,mdrv:.2,sc:.6,bars:2,tail:1};
const P=a=>{const r=Array(16).fill(0);a.forEach(i=>r[i]=1);return r};
const ST=[[0,10],[0,6,10],[4,12],[],[0,2,4,6,8,10,12,14],[15],[],[]];
const TR=['808','KICK','SNARE','CLAP','HAT','OPEN','PERC','SMP 1'].map((n,i)=>({n,fx:i>1,vol:.8,pan:0,tune:0,dec:1,drv:i?0:.35,mute:0,solo:0,buf:null,st:P(ST[i]).map(v=>i==4&&v?.75:v)}));
const mb=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const noise=c=>c._n||(c._n=(()=>{const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0),r=mb(1);for(let i=0;i<d.length;i++)d[i]=r()*2-1;return b})());
const curve=a=>{const n=1024,c=new Float32Array(n),k=1+a*8;for(let i=0;i<n;i++)c[i]=Math.tanh((i/(n-1)*2-1)*k)/Math.tanh(k);return c};
function build(c){const G={c,tr:[]},m=c.createGain(),ws=c.createWaveShaper(),lp=c.createBiquadFilter(),lim=c.createDynamicsCompressor(),out=c.createGain();
ws.oversample='2x';lp.type='lowpass';lim.threshold.value=-2;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.12;out.gain.value=.85;
m.connect(ws);ws.connect(lp);lp.connect(lim);lim.connect(out);out.connect(c.destination);
const dIn=c.createGain(),dl=c.createDelay(2),fb=c.createGain(),dr=c.createGain(),rIn=c.createGain(),cv=c.createConvolver(),rr=c.createGain();
fb.gain.value=.38;dIn.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(dr);dr.connect(m);
const n=c.sampleRate*2,ib=c.createBuffer(2,n,c.sampleRate),r=mb(3);for(let h=0;h<2;h++){const d=ib.getChannelData(h);for(let i=0;i<n;i++)d[i]=(r()*2-1)*(1-i/n)**3}
cv.buffer=ib;rIn.connect(cv);cv.connect(rr);rr.connect(m);Object.assign(G,{ws,lp,dl,dr,rr});
TR.forEach(t=>{const inn=c.createGain(),du=c.createGain(),sh=c.createWaveShaper(),pn=c.createStereoPanner(),v=c.createGain();
inn.connect(du);du.connect(sh);sh.connect(pn);pn.connect(v);v.connect(m);if(t.fx){v.connect(dIn);v.connect(rIn)}G.tr.push({inn,du,sh,pn,v})});
G.oh=c.createGain();G.oh.connect(G.tr[5].inn);return G}
function apply(G,only){const any=TR.some(t=>t.solo);G.ws.curve=curve(S.mdrv);G.lp.frequency.value=300*Math.pow(66,S.lp);
G.dl.delayTime.value=60/S.bpm*.75;G.dr.gain.value=S.dly;G.rr.gain.value=S.rev*1.6;
TR.forEach((t,i)=>{const a=G.tr[i];a.sh.curve=curve(t.drv);a.pn.pan.value=t.pan;a.v.gain.value=(only>=0?i==only:any?t.solo:!t.mute)?t.vol:0})}
const E=(c,t,pk,d,dest,a=.002)=>{const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.001,t+a+d);g.connect(dest);return g};
const O=(c,type,f,t,d,dest)=>{const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(t+d+.05);return o};
const Nz=(c,t,d,ft,fq,dest)=>{const s=c.createBufferSource(),f=c.createBiquadFilter();s.buffer=noise(c);f.type=ft;f.frequency.value=fq;s.connect(f);f.connect(dest);s.start(t,(t*7)%1.5);s.stop(t+d+.05)};
function trig(G,i,t,v){const c=G.c,x=TR[i],o=G.tr[i].inn,p=2**(x.tune/12),d=x.dec;
if(x.buf){const s=c.createBufferSource(),g=c.createGain(),a=x.ts||0,b=x.te==null?1:x.te,B=x.buf.duration,D=Math.max(.02,B*(b-a)/p*Math.min(1,d));s.buffer=x.buf;s.playbackRate.value=p;s.connect(g);g.connect(o);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.002);g.gain.setValueAtTime(v,t+D-.008);g.gain.linearRampToValueAtTime(0,t+D);s.start(t,B*a,B*(b-a));s.stop(t+D+.01);return}
if(i==0){const f=55*p,e=E(c,t,v,1.3*d,o,.004),os=O(c,'sine',f*2.5,t,1.4*d,e);os.frequency.exponentialRampToValueAtTime(f,t+.03)}
else if(i==1){const e=E(c,t,v,.4*d,o,.001),os=O(c,'sine',150*p,t,.4*d,e);os.frequency.exponentialRampToValueAtTime(46*p,t+.07);Nz(c,t,.012,'highpass',2500,E(c,t,v*.5,.012,o,.0005))}
else if(i==2){Nz(c,t,.2*d,'highpass',1800,E(c,t,v*.8,.18*d,o,.001));O(c,'triangle',185*p,t,.1,E(c,t,v*.6,.09,o,.001))}
else if(i==3){[0,.011,.022].forEach(x=>Nz(c,t+x,.02,'bandpass',1400,E(c,t+x,v*.7,.012,o,.0005)));Nz(c,t+.03,.2*d,'bandpass',1400,E(c,t+.03,v*.6,.18*d,o,.001))}
else if(i==4){G.oh.gain.cancelScheduledValues(t);G.oh.gain.setTargetAtTime(0,t,.004);Nz(c,t,.06*d,'highpass',7500*p,E(c,t,v*.45,.045*d,o,.0005))}
else if(i==5){G.oh.gain.cancelScheduledValues(t);G.oh.gain.setValueAtTime(1,t);Nz(c,t,.4*d,'highpass',7000*p,E(c,t,v*.4,.3*d,G.oh,.001))}
else if(i==6){O(c,'triangle',900*p,t,.08,E(c,t,v*.7,.07*d,o,.001)).frequency.exponentialRampToValueAtTime(500*p,t+.05)}
}
function step(G,n,t,r){TR.forEach((x,i)=>{const v=x.st[n];if(!v)return;const tt=Math.max(t+(r()-.5)*S.hum*.016,G.c.currentTime),vv=Math.min(1,v*(1+(r()-.5)*S.hum*.3));
if(i==1&&S.sc>0){const q=G.tr[0].du.gain;q.setValueAtTime(1-S.sc,tt);q.setTargetAtTime(1,tt+.01,.09)}trig(G,i,tt,vv)})}
let AC,G,run=0,nx,ix,tm,Q=[],sel=0;
const ctx=()=>{AC=AC||new AudioContext();AC.resume();if(!G){G=build(AC);apply(G,-1)}};
function tick(){const s=60/S.bpm/4;while(nx<AC.currentTime+.12){const t=nx+(ix%2?S.swing*s:0);step(G,ix,t,Math.random);Q.push([t,ix]);nx+=s;ix=(ix+1)%16}}
function draw(){if(!run)return;let c;while(Q.length&&Q[0][0]<=AC.currentTime)c=Q.shift()[1];if(c!=null)document.querySelectorAll('.st').forEach(b=>b.classList.toggle('ph',b.dataset.n==c));requestAnimationFrame(draw)}
$('#pl').onclick=()=>{if(run){run=0;clearInterval(tm);Q=[];$('#pl').textContent='▶';document.querySelectorAll('.ph').forEach(b=>b.classList.remove('ph'));return}
ctx();run=1;nx=AC.currentTime+.06;ix=0;tm=setInterval(tick,25);$('#pl').textContent='■';draw()};
$('#bpm').oninput=e=>{S.bpm=Math.max(50,Math.min(220,+e.target.value||90));G&&apply(G,-1)};
function ui(){drawPads();const g=$('#g');g.innerHTML='';TR.forEach((t,i)=>{const r=document.createElement('div');r.className='tr'+(i==sel?' sel':'');r.style.setProperty('--c',COL[i%9]);
r.innerHTML=`<div class=h><button class=nm data-t=${i}>${t.n}${t.buf?' ◆':i>6?' · vide':''}</button><span>${i>6?`<label class=btn>↑ son<input type=file accept="audio/*" data-up=${i}></label> `:''}${i>7?`<button data-rm=${i}>×</button> `:''}<button data-mu=${i} class="${t.mute?'on':''}">M</button> <button data-so=${i} class="${t.solo?'on':''}">S</button></span></div><div class=s>${t.st.map((v,n)=>`<button class=st data-i=${i} data-n=${n} style="--v:${v}"></button>`).join('')}</div>`;g.append(r)})}
$('#g').onclick=e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
if(D.n!=null){const t=TR[D.i];t.st[D.n]=L[(L.indexOf(t.st[D.n])+1)%4];b.style.setProperty('--v',t.st[D.n])}
else if(D.t!=null){sel=+D.t;ctx();trig(G,sel,AC.currentTime+.01,.9);ui();panel()}
else if(D.up!=null){sel=+D.up;ui();panel();$('#fi').click()}
else if(D.rm!=null){TR.splice(+D.rm,1);sel=Math.min(sel,TR.length-1);rebuild();ui();panel()}
else{if(D.mu!=null)TR[D.mu].mute^=1;else TR[D.so].solo^=1;ui();G&&apply(G,-1)}};
const TP=[['vol','Volume',0,1.2,.01],['pan','Pan',-1,1,.01],['tune','Pitch (demi-tons)',-12,12,1],['dec','Decay',.2,2.5,.01],['drv','Drive',0,1,.01]];
const MP=[['swing','Swing',0,.5,.01],['hum','Humanize',0,1,.01],['dly','Delay',0,.8,.01],['rev','Reverb',0,.8,.01],['lp','Filtre LP',0,1,.01],['mdrv','Drive master',0,1,.01],['sc','Sidechain 808',0,1,.01]];
const sl=(o,k,l,a,b,s)=>`<label>${l}<input type=range data-k=${k} min=${a} max=${b} step=${s} value=${o[k]}></label>`;
function panel(){const t=TR[sel];$('#tp').innerHTML=`<h3>${t.n}</h3>`+TP.map(([k,l,a,b,s])=>sl(t,k,l,a,b,s)).join('')+(t.buf?`<canvas id=wf></canvas>`+sl(t,'ts','Début',0,1,.001)+sl(t,'te','Fin',0,1,.001):'')+`<div class=w><label class=btn>Téléverser un son<input type=file accept="audio/*"></label><button id=rs>${sel<7?'Retour synthé':'Vider'}</button></div>`;$('#tp').style.setProperty('--c',COL[sel%9]);wf()}
$('#mp').innerHTML=MP.map(([k,l,a,b,s])=>sl(S,k,l,a,b,s)).join('');
$('#tp').oninput=e=>{const k=e.target.dataset.k,t=TR[sel];if(!k)return;t[k]=+e.target.value;if(k=='ts'&&t.ts>t.te-.01)e.target.value=t.ts=t.te-.01;if(k=='te'&&t.te<t.ts+.01)e.target.value=t.te=t.ts+.01;if(k=='ts'||k=='te')wf();G&&apply(G,-1)};
$('#mp').oninput=e=>{const k=e.target.dataset.k;if(k){S[k]=+e.target.value;G&&apply(G,-1)}};
$('#tp').onclick=e=>{const id=e.target.id;if(id=='up')$('#fi').click();if(id=='rs'){TR[sel].buf=null;ui();panel()}};
async function load(f,i){sel=i;AC=AC||new AudioContext();try{TR[sel].buf=await AC.decodeAudioData(await f.arrayBuffer());TR[sel].ts=0;TR[sel].te=1;if(sel>6)TR[sel].n=f.name.replace(/\.[^.]+$/,'').slice(0,12);ui();panel();ms('Son chargé sur '+TR[sel].n)}catch(x){ms('Fichier audio illisible')}};
$('#bars').onchange=e=>S.bars=+e.target.value;$('#tail').onchange=e=>S.tail=e.target.checked?1:0;
const ms=t=>$('#ms').textContent=t;
async function rnd(only){const s=60/S.bpm/4,len=S.bars*16*s+(S.tail?2.5:0),c=new OfflineAudioContext(2,Math.ceil(len*48000),48000),g=build(c),r=mb(42);apply(g,only);
for(let b=0;b<S.bars;b++)for(let n=0;n<16;n++)step(g,n,b*16*s+n*s+(n%2?S.swing*s:0),r);return c.startRendering()}
function wav(b){const ch=b.numberOfChannels,n=b.length,o=new DataView(new ArrayBuffer(44+n*ch*3)),w=(p,s)=>[...s].forEach((x,i)=>o.setUint8(p+i,x.charCodeAt(0)));
w(0,'RIFF');o.setUint32(4,36+n*ch*3,1);w(8,'WAVEfmt ');o.setUint32(16,16,1);o.setUint16(20,1,1);o.setUint16(22,ch,1);o.setUint32(24,b.sampleRate,1);o.setUint32(28,b.sampleRate*ch*3,1);o.setUint16(32,ch*3,1);o.setUint16(34,24,1);w(36,'data');o.setUint32(40,n*ch*3,1);
const d=[...Array(ch).keys()].map(i=>b.getChannelData(i));let p=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const v=Math.round(Math.max(-1,Math.min(1,d[c][i]))*8388607);o.setUint8(p++,v&255);o.setUint8(p++,v>>8&255);o.setUint8(p++,v>>16&255)}return new Uint8Array(o.buffer)}
function zip(F){const te=new TextEncoder(),ct=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^c>>>1:c>>>1;ct[n]=c>>>0}
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=ct[(c^u[i])&255]^c>>>8;return(c^-1)>>>0},H=(...f)=>{const b=[];f.forEach(([v,s])=>{for(let i=0;i<s;i++)b.push(v/2**(8*i)&255)});return new Uint8Array(b)};
const A=[],C=[];let off=0;F.forEach(([nm,u])=>{const n=te.encode(nm),cr=crc(u),l=u.length,h=H([0x04034b50,4],[20,2],[0,2],[0,2],[0,2],[33,2],[cr,4],[l,4],[l,4],[n.length,2],[0,2]);
C.push(H([0x02014b50,4],[20,2],[20,2],[0,2],[0,2],[0,2],[33,2],[cr,4],[l,4],[l,4],[n.length,2],[0,2],[0,2],[0,2],[0,2],[0,4],[off,4]),n);A.push(h,n,u);off+=h.length+n.length+l});
const cs=C.reduce((a,b)=>a+b.length,0);return[...A,...C,H([0x06054b50,4],[0,2],[0,2],[F.length,2],[F.length,2],[cs,4],[off,4],[0,2])]}
$('#ex').onclick=async()=>{const dl=await(window.claude&&claude.use?claude.use('downloads'):null);
try{const F=[];ms('Rendu du mix…');F.push(['mix.wav',wav(await rnd(-1))]);for(let i=0;i<TR.length;i++){if(!TR[i].st.some(Boolean))continue;ms('Stem '+TR[i].n+'…');F.push([`stems/${i+1}_${TR[i].n.replace(/[^\w-]/g,'_')}.wav`,wav(await rnd(i))])}
const fn=`beat_${S.bpm}bpm.zip`,bl=new Blob(zip(F),{type:'application/zip'});if(dl)await dl.save({filename:fn,data:bl});else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),9e3)}ms('Export terminé')}catch(x){ms('Export annulé ou échoué')}};
const rebuild=()=>{if(G){G=build(AC);apply(G,-1)}};
let rec=0;document.addEventListener('change',e=>{const el=e.target;if(el.type=='file'&&el.files[0])load(el.files[0],el.dataset.up!=null?+el.dataset.up:sel)});
function drawPads(){$('#pads').innerHTML=TR.map((t,i)=>`<button data-i=${i} style="--c:${COL[i%9]}">${t.n}</button>`).join('')}
function hit(i,v=.9){ctx();if(!TR[i])return;const t=AC.currentTime+.005;trig(G,i,t,v);if(i==1&&S.sc>0){const q=G.tr[0].du.gain;q.setValueAtTime(1-S.sc,t);q.setTargetAtTime(1,t+.01,.09)}
if(rec&&run){const s=60/S.bpm/4,k=((ix-Math.round((nx-AC.currentTime)/s))%16+16)%16,b=document.querySelector(`.st[data-i="${i}"][data-n="${k}"]`);TR[i].st[k]=1;b&&b.style.setProperty('--v',1)}}
$('#pads').onpointerdown=e=>{const b=e.target.closest('button');if(b){e.preventDefault();hit(+b.dataset.i)}};
$('#rec').onclick=e=>{rec^=1;e.currentTarget.classList.toggle('on',!!rec)};
const mi=a=>a.inputs.forEach(p=>p.onmidimessage=m=>{const[s,n,v]=m.data,N=TR.length;if((s&240)==144&&v>0)hit(((n-36)%N+N)%N,Math.max(.3,v/127))});

function wf(){const t=TR[sel],cv=$('#wf');if(!cv||!t.buf)return;const w=cv.width=(cv.clientWidth||300)*2,h=cv.height=96,d=t.buf.getChannelData(0),n=Math.max(1,Math.floor(d.length/w)),x=cv.getContext('2d');x.fillStyle=getComputedStyle(cv).getPropertyValue('--c').trim()||'#ff3b30';for(let i=0;i<w;i++){let m=0;for(let j=0;j<n;j+=Math.max(1,n>>4))m=Math.max(m,Math.abs(d[i*n+j]||0));x.fillRect(i,h/2-m*h/2,1,Math.max(1,m*h))}x.fillStyle='rgba(120,120,120,.6)';x.fillRect(0,0,t.ts*w,h);x.fillRect(t.te*w,0,w-t.te*w,h)}
