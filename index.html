<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171714">
<title>Celluloid Circles — Pizza Lab</title>
<style>
:root{--bg:#171714;--panel:#22221e;--panel2:#2b2b25;--ink:#f1eedf;--muted:#aaa795;--red:#ef5b42;--yellow:#e8c75a;--line:#45443a;--green:#a8c77b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:18px 14px 36px}
main{max-width:760px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.logo{font-weight:900;letter-spacing:.08em;font-size:13px}.logo span{color:var(--red)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 8px;border-radius:20px}
h1{font-size:clamp(27px,7vw,42px);line-height:1;margin:8px 0 7px;letter-spacing:-.05em}
.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}
.upload{display:flex;align-items:center;justify-content:center;gap:10px;border:1px dashed #77715e;border-radius:12px;padding:17px;text-align:center;background:#1d1d19;cursor:pointer}
.upload strong{display:block}.upload small{color:var(--muted)}
input[type=file]{display:none}
.fileline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 13px;border-radius:10px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--red);border-color:var(--red);color:#1a1713;font-weight:800}
button.active{background:var(--yellow);border-color:var(--yellow);color:#191812}
button:disabled{opacity:.35;cursor:not-allowed}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
label{font-size:12px;color:var(--muted)}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.pizza-wrap{display:grid;grid-template-columns:minmax(220px,1fr) minmax(150px,.7fr);gap:16px;align-items:center}
@media(max-width:560px){.pizza-wrap{grid-template-columns:1fr}.pizza-side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pizza-side .hint{grid-column:1/-1}}
#pizza{width:100%;max-width:390px;aspect-ratio:1;display:block;margin:auto;touch-action:manipulation}
.slice{cursor:pointer;stroke:#1b1a16;stroke-width:2.5}
.slice.selected{stroke:var(--yellow);stroke-width:6}
.slice.playing{stroke:var(--green);stroke-width:6}
.slice-label{fill:#211e17;font-size:12px;font-weight:900;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.stat{font-size:12px;color:var(--muted);margin-top:4px}
.pizza-side .box{background:#1b1b17;border:1px solid var(--line);padding:10px;border-radius:10px;margin-bottom:8px}
.big{font-size:23px;font-weight:900}
input[type=range]{width:100%;accent-color:var(--red)}
.range-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:10px 0}
.range-row output{font-variant-numeric:tabular-nums;color:var(--yellow);font-size:12px}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0}
.step{padding:12px 0;text-align:center;font-weight:800}
.step.on{background:var(--red);border-color:var(--red);color:#191511}
.step.current{outline:2px solid var(--yellow);outline-offset:2px}
.note{color:var(--muted);font-size:12px;line-height:1.5}
.status{font-size:12px;color:var(--green);min-height:18px;margin-top:8px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
footer{color:var(--muted);font-size:11px;text-align:center;margin-top:22px}

.wave-wrap{margin:14px 0 5px;background:linear-gradient(180deg,#111925,#151e2b);border:1px solid rgba(164,184,211,.2);border-radius:13px;padding:10px 10px 8px;box-shadow:inset 0 0 22px rgba(0,0,0,.25)}
#waveform{display:block;width:100%;height:142px;touch-action:none;cursor:ew-resize}
.wave-legend{display:flex;justify-content:space-between;gap:12px;margin-top:6px;color:#aebaca;font-size:11px;letter-spacing:.08em}
.wave-legend span{display:flex;align-items:center;gap:6px}
.wave-legend b{color:#f4f2e9;font-variant-numeric:tabular-nums;letter-spacing:0}
.wave-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.in-dot{background:#ff795d}.out-dot{background:#f6d365}
.wave-help{font-size:11px;color:#9eacbd;margin:7px 2px 2px}
@media(max-width:560px){#waveform{height:124px}}

</style>

<style>
:root{
 --bg:#0d1016;--panel:rgba(24,29,39,.88);--panel2:#202837;--ink:#f4f2e9;
 --muted:#a2adbd;--red:#ff684f;--yellow:#f6d365;--line:rgba(164,184,211,.17);
 --green:#a9efb4;--cyan:#70d7e8;--glow:rgba(255,104,79,.25)
}
body{
 background:radial-gradient(ellipse at 12% 0%,rgba(112,215,232,.13),transparent 35%),
 radial-gradient(ellipse at 90% 22%,rgba(255,104,79,.12),transparent 32%),
 linear-gradient(160deg,#0d1016,#121722 55%,#0b0e13);
 background-attachment:fixed;color:var(--ink)
}
header{padding:5px 2px 4px}
.logo{font-size:12px;letter-spacing:.16em}
.logo span{color:var(--red);text-shadow:0 0 14px var(--red)}
.tag{background:rgba(255,255,255,.035);border-color:var(--line);color:#c1cbd7;letter-spacing:.1em;text-transform:uppercase}
h1{font-size:clamp(30px,8vw,44px);letter-spacing:-.065em;line-height:.94;text-shadow:0 5px 30px rgba(0,0,0,.3);margin:8px 0 12px}
.sub{display:none}
.panel{
 position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(31,39,53,.94),rgba(19,24,34,.94));
 border:1px solid var(--line);border-radius:19px;padding:17px;margin:14px 0;
 box-shadow:0 12px 35px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.035);
 backdrop-filter:blur(12px)
}
.panel:before{content:"";position:absolute;left:0;top:0;width:64px;height:2px;background:linear-gradient(90deg,var(--red),transparent);opacity:.8}
.panel>.row strong{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.upload{
 background:linear-gradient(120deg,rgba(255,104,79,.10),rgba(112,215,232,.07));
 border:1px dashed rgba(112,215,232,.48);border-radius:14px;padding:22px 15px;
 transition:.2s;box-shadow:inset 0 0 24px rgba(112,215,232,.025)
}
.upload:active{transform:scale(.99);border-color:var(--red)}
.upload strong{font-size:15px}.upload small{display:block;margin-top:4px;color:var(--muted)}
button,select{
 background:linear-gradient(180deg,#293548,#202a39);border:1px solid rgba(164,184,211,.22);
 color:var(--ink);border-radius:11px;padding:10px 13px;
 box-shadow:0 3px 9px rgba(0,0,0,.16);transition:transform .15s,border-color .15s,filter .15s
}
button:hover{border-color:rgba(112,215,232,.55);filter:brightness(1.1)}
button:active{transform:translateY(1px) scale(.98)}
button.primary{background:linear-gradient(135deg,#ff795d,#ed4f46);border-color:#ff8b70;color:#1b1112;box-shadow:0 5px 18px rgba(255,104,79,.2);font-weight:900}
button.active,.step.on{background:linear-gradient(135deg,#f6d365,#e9ad4c);border-color:#ffe08b;color:#191713}
button:disabled{opacity:.32;filter:grayscale(.5)}
select{padding:8px 11px}
.range-row{margin:13px 0}
.range-row output{color:var(--cyan);font-weight:700}
input[type=range]{accent-color:var(--red);height:24px;cursor:pointer}
.pizza-wrap{gap:12px}
#pizza{filter:drop-shadow(0 12px 22px rgba(0,0,0,.42));overflow:visible}
.slice{stroke:#9b5a2d;stroke-width:2.5;transition:filter .18s,stroke-width .18s,opacity .18s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
.slice:hover{filter:brightness(1.12) drop-shadow(0 0 8px rgba(255,220,130,.35))}
.slice.selected{stroke:#fff0a6;stroke-width:6;filter:brightness(1.12) drop-shadow(0 0 11px rgba(246,211,101,.6))}
.slice.playing{stroke:var(--green);stroke-width:7;filter:brightness(1.2) drop-shadow(0 0 14px rgba(169,239,180,.7))}
.slice-label{fill:#5b2d20;font-size:13px;font-weight:950;paint-order:stroke;stroke:rgba(255,244,205,.65);stroke-width:1.6px}
.pizza-side .box{background:linear-gradient(145deg,rgba(112,215,232,.09),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:13px;padding:13px}
.big{font-size:27px;letter-spacing:-.04em;color:var(--yellow)}
.stat{color:#b6c2d0}
.steps{gap:7px}
.step{border-radius:9px;padding:12px 0;background:#202a39}
.step.current{outline:2px solid var(--cyan);box-shadow:0 0 13px rgba(112,215,232,.3)}
.note{display:none}
.status{display:none}
footer{display:none}
@media(max-width:560px){
 body{padding:14px 11px 28px}
 .panel{padding:14px;border-radius:16px}
 .pizza-wrap{gap:5px}
 #pizza{max-width:350px}
 .pizza-side{grid-template-columns:1fr 1fr}
 .pizza-side .box{grid-column:1/-1}
 .pizza-side button{min-height:44px}
 .steps{gap:5px}
 .step{padding:11px 0}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<main>
<header><div class="logo">CELLULOID <span>●</span> CIRCLES</div><div class="tag">PIZZA LAB</div></header>
<h1>Pizza Lab</h1>

<section class="panel">
<label class="upload" for="file"><div><strong>＋ Importer un sample</strong><small>MP3 · WAV · OGG</small></div></label>
<input id="file" type="file" accept="audio/*">
<div class="fileline"><span id="filename">Aucun sample chargé</span><span id="duration">—</span></div>
<div class="controls" style="margin-top:12px">
<button id="preview" disabled>▶ Original</button>
<button id="stopPreview" disabled>■ Stop</button>
</div>
<audio id="previewAudio" preload="metadata" style="display:none"></audio>
<div class="status" id="status"></div>
</section>

<section class="panel">
<div class="row"><strong>Trim</strong><span class="tag">IN / OUT</span></div>
<div class="wave-wrap" id="waveWrap">
 <canvas id="waveform" aria-label="Forme d'onde du sample. Déplace les poignées IN et OUT pour ajuster le trim."></canvas>
 <div class="wave-legend"><span><i class="in-dot"></i> IN <b id="trimStartOut">0.00 s</b></span><span><i class="out-dot"></i> OUT <b id="trimEndOut">—</b></span></div>
</div>
<p class="wave-help">Glisse les poignées verticales sur la forme d'onde pour choisir précisément le début et la fin.</p>
<div class="controls"><button id="trimReset" disabled>↺ Reset</button><button id="previewTrim" disabled>▶ Trim</button></div>
<div class="stat" id="trimLength">Zone sélectionnée : —</div>
</section>

<section class="panel">
<div class="row"><strong>Pizza</strong><div class="controls"><label for="count">Slices</label><select id="count"><option>4</option><option selected>8</option><option>12</option><option>16</option></select></div></div>
<div class="pizza-wrap">
<svg id="pizza" viewBox="0 0 400 400" role="group" aria-label="Découpe circulaire du sample"></svg>
<div class="pizza-side">
<div class="box"><label>SLICE</label><div class="big" id="selectedName">—</div><div class="stat" id="selectedTime">Charge un sample</div></div>
<button class="primary" id="playSlice" disabled>▶ Play</button>
<button id="stopAll" disabled>■ Stop</button>

</div>
</div>
</section>

<section class="panel">
<div class="row"><strong>FX</strong><span class="tag">LIVE</span></div>
<div class="range-row"><label for="volume">Volume</label><output id="volOut">85%</output><input id="volume" type="range" min="0" max="100" value="85" style="grid-column:1/-1"></div>
<div class="range-row"><label for="pitch">Pitch</label><output id="pitchOut">1.00×</output><input id="pitch" type="range" min="50" max="150" value="100" style="grid-column:1/-1"></div>
<div class="range-row"><label for="fade">Fade</label><output id="fadeOut">10 ms</output><input id="fade" type="range" min="0" max="250" value="10" style="grid-column:1/-1"></div>
<div class="controls">
<button id="reverse" disabled>↶ Reverse</button>
<button id="shuffle" disabled>⤨ Shuffle</button>
<button id="reset" disabled>Reset</button>
</div>

</section>

<section class="panel">
<div class="row"><strong>Loop</strong><div class="controls"><label for="bpm">BPM</label><input id="bpm" type="number" min="40" max="220" value="90" style="width:66px;background:#2b2b25;color:#f1eedf;border:1px solid #45443a;border-radius:8px;padding:8px"></div></div>
<div class="steps" id="steps"></div>
<div class="controls">
<button class="primary" id="seqPlay" disabled>▶ Play loop</button>
<button id="seqStop" disabled>■ Stop</button>
<button id="clearSteps" disabled>Clear</button>
</div>

</section>

</main>
<script>
(() => {
const $ = id => document.getElementById(id);
const fileInput=$('file'), preview=$('previewAudio'), svg=$('pizza');
let fileURL=null, duration=0, trimStart=0, trimEnd=0, count=8, selected=0, order=[], voices=[], audioCtx=null, master=null;
let waveformPeaks=[], dragHandle=null;
let seqTimer=null, seqIndex=0, seqRunning=false, stepPattern=Array(8).fill(false), seqStart=0;
const colors=['#e8c75a','#d8a85b','#c87d4d','#a8b86d','#78a99a','#7898a9','#a48ab3','#d17c86'];
function say(s){$('status').textContent=s}
function initAudio(){
 if(audioCtx) return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC) throw new Error('Web Audio non disponible dans ce navigateur.');
 audioCtx=new AC(); master=audioCtx.createGain(); master.gain.value=Number($('volume').value)/100; master.connect(audioCtx.destination);
}
let playbackToken=0, activeVoice=null;
function stopVoice(v){
 if(!v)return;
 v.audio.ontimeupdate=null;
 v.audio.onended=null;
 v.audio.pause();
 try{v.audio.currentTime=0}catch(e){}
 v.gain.gain.cancelScheduledValues(audioCtx.currentTime);
 v.gain.gain.setValueAtTime(Number($('volume').value)/100,audioCtx.currentTime);
}
function stopAll(){
 playbackToken++;
 voices.forEach(stopVoice);
 activeVoice=null;
 document.querySelectorAll('.slice').forEach(n=>n.classList.remove('playing'));
}
function makeVoices(){
 stopAll();
 voices.forEach(v=>{try{v.audio.pause();v.audio.removeAttribute('src');v.audio.load()}catch(e){}});
 voices=[];
 for(let i=0;i<8;i++){
  const a=new Audio(); a.preload='auto'; a.src=fileURL;
  const src=audioCtx.createMediaElementSource(a), gain=audioCtx.createGain();
  src.connect(gain);gain.connect(master);
  voices.push({audio:a,gain});
 }
}
function bounds(part){
 const span=Math.max(0,trimEnd-trimStart);
 const start=trimStart+span*part/count, end=trimStart+span*(part+1)/count;
 return {start,end};
}
function drawWaveform(){
 const canvas=$('waveform'); if(!canvas)return;
 const rect=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
 const w=Math.max(1,Math.floor(rect.width*dpr)), h=Math.max(1,Math.floor(rect.height*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);
 const mid=h/2, pad=8*dpr, usable=h-2*pad;
 // Subtle center line and waveform peaks. Audio is decoded only to draw this display;
 // playback continues to use the original HTMLAudioElement source.
 ctx.strokeStyle='rgba(190,207,225,.18)';ctx.lineWidth=1*dpr;
 ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(w,mid);ctx.stroke();
 const peaks=waveformPeaks;
 if(peaks.length){
  const step=w/peaks.length;
  for(let i=0;i<peaks.length;i++){
   const x=i*step, amp=Math.max(1*dpr,peaks[i]*usable*.48);
   ctx.fillStyle=(i/peaks.length>=trimStart/duration&&i/peaks.length<=trimEnd/duration)
    ?'rgba(112,215,232,.88)':'rgba(130,145,164,.25)';
   ctx.fillRect(x,mid-amp,Math.max(1*dpr,step*.72),amp*2);
  }
 }else{
  ctx.fillStyle='rgba(150,165,184,.5)';ctx.font=`${12*dpr}px system-ui`;
  ctx.textAlign='center';ctx.fillText('Préparation de la forme d’onde…',w/2,mid+4*dpr);
 }
 // Dim the discarded regions.
 const xIn=duration?trimStart/duration*w:0, xOut=duration?trimEnd/duration*w:w;
 ctx.fillStyle='rgba(5,8,13,.60)';
 ctx.fillRect(0,0,xIn,h);ctx.fillRect(xOut,0,w-xOut,h);
 // Selection border and draggable handles.
 ctx.strokeStyle='#f6d365';ctx.lineWidth=2*dpr;
 ctx.strokeRect(xIn,1*dpr,Math.max(0,xOut-xIn),h-2*dpr);
 [ [xIn,'#ff795d'],[xOut,'#f6d365'] ].forEach(([x,color])=>{
  ctx.fillStyle=color;ctx.fillRect(x-1.5*dpr,0,3*dpr,h);
  ctx.beginPath();ctx.arc(x,h/2,7*dpr,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-5*dpr,mid);ctx.lineTo(x+5*dpr,mid);ctx.strokeStyle='#151a22';ctx.lineWidth=1.5*dpr;ctx.stroke();
 });
}
async function buildWaveform(file){
 waveformPeaks=[];drawWaveform();
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  const temp=new AC();
  const bytes=await file.arrayBuffer();
  const decoded=await temp.decodeAudioData(bytes.slice(0));
  const channels=[];
  for(let c=0;c<decoded.numberOfChannels;c++)channels.push(decoded.getChannelData(c));
  const bins=Math.min(1800,Math.max(500,Math.floor(decoded.duration*35)));
  const block=Math.max(1,Math.floor(decoded.length/bins));
  const peaks=new Array(bins).fill(0);
  for(let i=0;i<bins;i++){
   const from=i*block,to=Math.min(decoded.length,from+block);
   let peak=0;
   for(const data of channels)for(let j=from;j<to;j++)peak=Math.max(peak,Math.abs(data[j]));
   peaks[i]=peak;
  }
  waveformPeaks=peaks;
  await temp.close();
  drawWaveform();
 }catch(e){
  say('Audio prêt. Forme d’onde indisponible sur ce fichier, trim toujours utilisable.');
 }
}
function waveformPointerDown(e){
 if(!duration)return;
 const rect=$('waveform').getBoundingClientRect(), x=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
 const t=x*duration, ds=Math.abs(t-trimStart), de=Math.abs(t-trimEnd);
 dragHandle=ds<=de?'in':'out';
 $('waveform').setPointerCapture(e.pointerId);
 waveformPointerMove(e);
}
function waveformPointerMove(e){
 if(!dragHandle||!duration)return;
 const rect=$('waveform').getBoundingClientRect(), x=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
 const t=x*duration, gap=Math.min(.03,duration/100);
 if(dragHandle==='in')trimStart=Math.max(0,Math.min(t,trimEnd-gap));
 else trimEnd=Math.min(duration,Math.max(t,trimStart+gap));
 updateTrimUI();
}
function waveformPointerUp(){dragHandle=null}
function updateTrimUI(){
 $('trimStartOut').textContent=trimStart.toFixed(2)+' s';
 $('trimEndOut').textContent=trimEnd.toFixed(2)+' s';
 $('trimLength').textContent='Zone sélectionnée : '+Math.max(0,trimEnd-trimStart).toFixed(2)+' s · '+count+' parts de '+((trimEnd-trimStart)/count).toFixed(2)+' s';
 updateSelection();drawWaveform();
}
async function seekMedia(audio, target, token){
 if(Math.abs(audio.currentTime-target)<0.025 && !audio.seeking)return;
 await new Promise(resolve=>{
  let done=false;
  const finish=()=>{if(done)return;done=true;audio.removeEventListener('seeked',finish);audio.removeEventListener('error',finish);clearTimeout(fallback);resolve()};
  const fallback=setTimeout(finish,900);
  audio.addEventListener('seeked',finish,{once:true});
  audio.addEventListener('error',finish,{once:true});
  try{audio.currentTime=target}catch(e){finish()}
 });
 return token===playbackToken;
}
async function playPart(part){
 if(!fileURL||!duration)return;
 const token=(++playbackToken);
 try{
  initAudio();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  if(token!==playbackToken)return;
  // Une seule voix active : jouer une nouvelle part coupe systématiquement la précédente.
  voices.forEach(stopVoice);
  const v=voices[0];
  activeVoice=v;
  const {start,end}=bounds(part), rate=Number($('pitch').value)/100;
  const fade=Number($('fade').value)/1000;
  const volume=Number($('volume').value)/100;
  v.audio.playbackRate=rate;
  v.audio.preservesPitch=false;
  v.gain.gain.cancelScheduledValues(audioCtx.currentTime);
  v.gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  const ok=await seekMedia(v.audio,start,token);
  if(ok===false||token!==playbackToken)return;
  if(fade>0 && (end-start)/rate>fade){
   const now=audioCtx.currentTime, length=(end-start)/rate;
   v.gain.gain.setValueAtTime(volume,now+Math.max(0,length-fade));
   v.gain.gain.linearRampToValueAtTime(0,now+length);
  }
  const sliceNode=svg.querySelector(`.slice[data-part="${part}"]`);
  const finish=()=>{
   if(token!==playbackToken)return;
   v.audio.ontimeupdate=null;v.audio.onended=null;v.audio.pause();
   try{v.audio.currentTime=start}catch(e){}
   v.gain.gain.cancelScheduledValues(audioCtx.currentTime);
   v.gain.gain.setValueAtTime(volume,audioCtx.currentTime);
   if(sliceNode)sliceNode.classList.remove('playing');
   activeVoice=null;
  };
  v.audio.ontimeupdate=()=>{
   if(token===playbackToken && v.audio.currentTime>=end-0.025)finish();
  };
  v.audio.onended=finish;
  await v.audio.play();
  if(token!==playbackToken){v.audio.pause();return}
  if(sliceNode)sliceNode.classList.add('playing');
 }catch(e){
  if(token===playbackToken)say('Lecture impossible : '+e.message);
 }
}
function renderPizza(){
 svg.innerHTML='';
 const ns='http://www.w3.org/2000/svg', cx=200,cy=200,r=174;
 const defs=document.createElementNS(ns,'defs');
 defs.innerHTML=`
  <radialGradient id="cheese" cx="45%" cy="38%" r="70%">
   <stop offset="0%" stop-color="#ffe89a"/><stop offset="72%" stop-color="#f4c85f"/><stop offset="100%" stop-color="#d9953d"/>
  </radialGradient>
  <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#f4c17a"/><stop offset="55%" stop-color="#bd7138"/><stop offset="100%" stop-color="#8e4928"/>
  </linearGradient>
  <radialGradient id="pepperoni">
   <stop offset="0%" stop-color="#d85b42"/><stop offset="75%" stop-color="#a92e2c"/><stop offset="100%" stop-color="#702126"/>
  </radialGradient>
  <filter id="pizzaShadow" x="-20%" y="-20%" width="140%" height="140%">
   <feGaussianBlur stdDeviation="3"/>
  </filter>`;
 svg.appendChild(defs);

 // Pizza shadow and whole crust ring.
 const shadow=document.createElementNS(ns,'circle');
 shadow.setAttribute('cx',cx);shadow.setAttribute('cy',cy+5);shadow.setAttribute('r',r+3);
 shadow.setAttribute('fill','#000');shadow.setAttribute('opacity','.45');shadow.setAttribute('filter','url(#pizzaShadow)');
 svg.appendChild(shadow);
 const crustBase=document.createElementNS(ns,'circle');
 crustBase.setAttribute('cx',cx);crustBase.setAttribute('cy',cy);crustBase.setAttribute('r',r);
 crustBase.setAttribute('fill','url(#crust)');crustBase.setAttribute('stroke','#713b25');crustBase.setAttribute('stroke-width','3');
 svg.appendChild(crustBase);

 // Each slice is a clickable wedge with its own toppings.
 for(let i=0;i<count;i++){
  const a0=(-Math.PI/2)+(i/count)*Math.PI*2, a1=(-Math.PI/2)+((i+1)/count)*Math.PI*2;
  const x0=cx+(r-13)*Math.cos(a0),y0=cy+(r-13)*Math.sin(a0);
  const x1=cx+(r-13)*Math.cos(a1),y1=cy+(r-13)*Math.sin(a1);
  const large=(a1-a0)>Math.PI?1:0;
  const group=document.createElementNS(ns,'g');
  group.setAttribute('class','pizza-slice');
  group.dataset.part=i;
  const path=document.createElementNS(ns,'path');
  path.setAttribute('d',`M ${cx} ${cy} L ${x0} ${y0} A ${r-13} ${r-13} 0 ${large} 1 ${x1} ${y1} Z`);
  path.setAttribute('fill','url(#cheese)');
  path.setAttribute('stroke','#9b5a2d');
  path.setAttribute('stroke-width','2.5');
  path.setAttribute('class','slice'+(i===selected?' selected':''));
  path.dataset.part=i;
  path.addEventListener('click',()=>{selected=i;renderPizza();updateSelection()});
  group.appendChild(path);

  const mid=(a0+a1)/2;
  // Toppings are placed in the interior of each wedge, avoiding the crust.
  const spread=Math.max(.08,(a1-a0)*.23);
  const toppingCount=count<=4?5:count<=8?3:2;
  for(let k=0;k<toppingCount;k++){
   const frac=(k+1)/(toppingCount+1);
   const angle=a0+(a1-a0)*(.28+.44*frac);
   const rr=52+((i*19+k*31)%62);
   const tx=cx+rr*Math.cos(angle),ty=cy+rr*Math.sin(angle);
   const pepper=document.createElementNS(ns,'circle');
   pepper.setAttribute('cx',tx);pepper.setAttribute('cy',ty);
   pepper.setAttribute('r',count>=12?5.2:7.2);
   pepper.setAttribute('fill','url(#pepperoni)');
   pepper.setAttribute('stroke','#7c3028');pepper.setAttribute('stroke-width','1.1');
   pepper.setAttribute('pointer-events','none');
   group.appendChild(pepper);
   const glint=document.createElementNS(ns,'circle');
   glint.setAttribute('cx',tx-2);glint.setAttribute('cy',ty-2);
   glint.setAttribute('r',1.7);glint.setAttribute('fill','#f6a078');glint.setAttribute('opacity','.75');
   glint.setAttribute('pointer-events','none');group.appendChild(glint);
  }
  // A few tiny herb flecks.
  for(let k=0;k<3;k++){
   const angle=a0+(a1-a0)*(.2+.3*k), rr=85+((i*13+k*17)%28);
   const herb=document.createElementNS(ns,'ellipse');
   herb.setAttribute('cx',cx+rr*Math.cos(angle));herb.setAttribute('cy',cy+rr*Math.sin(angle));
   herb.setAttribute('rx','2.4');herb.setAttribute('ry','1.2');
   herb.setAttribute('transform',`rotate(${(i*37+k*53)%180} ${herb.getAttribute('cx')} ${herb.getAttribute('cy')})`);
   herb.setAttribute('fill','#57733d');herb.setAttribute('pointer-events','none');group.appendChild(herb);
  }
  // Number on each slice.
  const labelR=116, tx=cx+labelR*Math.cos(mid),ty=cy+labelR*Math.sin(mid);
  const text=document.createElementNS(ns,'text');
  text.setAttribute('x',tx);text.setAttribute('y',ty);text.setAttribute('class','slice-label');
  text.textContent=String(order.indexOf(i)+1);text.setAttribute('pointer-events','none');
  group.appendChild(text);
  svg.appendChild(group);
 }

 // Center label styled like a small pizza badge.
 const center=document.createElementNS(ns,'circle');
 center.setAttribute('cx',cx);center.setAttribute('cy',cy);center.setAttribute('r',28);
 center.setAttribute('fill','#9f4c2e');center.setAttribute('stroke','#f4c17a');center.setAttribute('stroke-width','4');
 svg.appendChild(center);
 const label=document.createElementNS(ns,'text');
 label.setAttribute('x',cx);label.setAttribute('y',cy+4);label.setAttribute('fill','#fff0c5');
 label.setAttribute('font-size','10');label.setAttribute('font-weight','950');
 label.setAttribute('text-anchor','middle');label.textContent='CC';svg.appendChild(label);
}
function updateSelection(){
 $('selectedName').textContent='PART '+String(order.indexOf(selected)+1).padStart(2,'0');
 if(duration){const b=bounds(selected);$('selectedTime').textContent=`${b.start.toFixed(2)}s → ${b.end.toFixed(2)}s · ${(b.end-b.start).toFixed(2)}s`}
}
function renderSteps(){
 $('steps').innerHTML='';
 stepPattern.forEach((on,i)=>{const b=document.createElement('button');b.className='step'+(on?' on':'');b.textContent=order[i%count]+1;b.addEventListener('click',()=>{stepPattern[i]=!stepPattern[i];renderSteps()});$('steps').appendChild(b)});
}
function stopSequence(){if(seqTimer)clearInterval(seqTimer);seqTimer=null;seqRunning=false;$('seqPlay').textContent='▶ Lancer la séquence';document.querySelectorAll('.step').forEach(n=>n.classList.remove('current'))}
function tickSequence(){
 const bpm=Math.max(40,Math.min(220,Number($('bpm').value)||90)), interval=60000/bpm;
 document.querySelectorAll('.step').forEach((n,i)=>n.classList.toggle('current',i===seqIndex));
 if(stepPattern[seqIndex])playPart(order[seqIndex%count]);
 seqIndex=(seqIndex+1)%8;
}
function resetOrder(){order=Array.from({length:count},(_,i)=>i);selected=0;renderPizza();updateSelection();renderSteps()}
fileInput.addEventListener('change',()=>{
 const f=fileInput.files&&fileInput.files[0];if(!f)return;
 if(!f.type.startsWith('audio/')){say('Choisis un fichier audio.');return}
 if(fileURL)URL.revokeObjectURL(fileURL);
 fileURL=URL.createObjectURL(f);preview.src=fileURL;preview.load();
 $('filename').textContent=f.name;$('duration').textContent='Lecture des infos…';say('Sample importé. Préparation du lecteur…');
 preview.onloadedmetadata=()=>{
  duration=preview.duration;trimStart=0;trimEnd=duration;
  $('duration').textContent=duration.toFixed(1)+' s';
  $('preview').disabled=false;$('stopPreview').disabled=false;
  $('trimReset').disabled=false;$('previewTrim').disabled=false;
  ['playSlice','stopAll','reverse','shuffle','reset','seqPlay','seqStop','clearSteps'].forEach(id=>$(id).disabled=false);
  try{initAudio();makeVoices();say('Prêt. La lecture utilise le fichier original, sans décodage PCM.')}catch(e){say(e.message)}
  updateTrimUI();updateSelection();renderPizza();renderSteps();buildWaveform(f);
 };
 preview.onerror=()=>say('Ce format ne peut pas être lu par le navigateur.');
});
function playTrimPreview(){
 if(!duration)return;
 preview.pause();
 const start=trimStart, end=trimEnd;
 preview.ontimeupdate=()=>{if(preview.currentTime>=end){preview.pause();preview.currentTime=start;preview.ontimeupdate=null}};
 const begin=()=>{preview.removeEventListener('seeked',begin);preview.play().catch(e=>say(e.message))};
 preview.addEventListener('seeked',begin,{once:true});
 preview.currentTime=start;
}
$('preview').addEventListener('click',playTrimPreview);
$('previewTrim').addEventListener('click',playTrimPreview);
$('stopPreview').addEventListener('click',()=>{preview.pause();preview.currentTime=trimStart;preview.ontimeupdate=null});
$('waveform').addEventListener('pointerdown',waveformPointerDown);
$('waveform').addEventListener('pointermove',waveformPointerMove);
$('waveform').addEventListener('pointerup',waveformPointerUp);
$('waveform').addEventListener('pointercancel',waveformPointerUp);
$('trimReset').addEventListener('click',()=>{
 trimStart=0;trimEnd=duration;updateTrimUI();drawWaveform();
});
$('count').addEventListener('change',()=>{count=Number($('count').value);resetOrder();updateTrimUI()});
$('playSlice').addEventListener('click',()=>playPart(selected));
$('stopAll').addEventListener('click',stopAll);
$('volume').addEventListener('input',()=>{$('volOut').textContent=$('volume').value+'%';if(master)master.gain.setTargetAtTime(Number($('volume').value)/100,audioCtx.currentTime,.01)});
$('pitch').addEventListener('input',()=>$('pitchOut').textContent=(Number($('pitch').value)/100).toFixed(2)+'×');
$('fade').addEventListener('input',()=>$('fadeOut').textContent=$('fade').value+' ms');
$('reverse').addEventListener('click',()=>{order.reverse();renderPizza();renderSteps()});
$('shuffle').addEventListener('click',()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}renderPizza();renderSteps()});
$('reset').addEventListener('click',resetOrder);
$('seqPlay').addEventListener('click',async()=>{if(seqRunning)return;try{initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();seqRunning=true;seqIndex=0;$('seqPlay').textContent='● Séquence en cours';tickSequence();seqTimer=setInterval(tickSequence,60000/Math.max(40,Math.min(220,Number($('bpm').value)||90)))}catch(e){say(e.message)}});
$('seqStop').addEventListener('click',()=>{stopSequence();stopAll()});
$('clearSteps').addEventListener('click',()=>{stepPattern.fill(false);renderSteps()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&seqRunning){stopSequence();stopAll()}});
resetOrder();
window.addEventListener('resize',drawWaveform);
})();
</script>
</body>
</html>
