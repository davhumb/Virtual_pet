<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colonie Ocre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{--bg:#1d2430;--panel:#2a3342;--ink:#f1e6d6;--mute:#9aa6b8;--sig:#f2c14e;--air:#7fd1c7;--bad:#ff7a59;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#1d2430}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}
#hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st{background:var(--panel);border-radius:6px;padding:5px 6px;line-height:1.1}
.st b{display:block;font-size:20px;font-weight:700}
.st span{font-size:13px;color:var(--mute)}
#cv{width:100%;display:block;border-radius:6px;touch-action:none}
#msg{min-height:22px;font-size:17px;color:var(--sig)}
#row{display:flex;gap:6px;align-items:center}#row #msg{flex:1}#row button{font-size:15px;padding:4px 10px;white-space:nowrap}#ev{position:fixed;inset:0;background:rgba(5,8,16,.72);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}#evc{background:#141b2b;border:2px solid #f2c14e;border-radius:8px;padding:14px;max-width:360px;width:100%;color:#e8e4d8}#evc h3{margin:0 0 6px;color:#f2c14e;font-size:16px;letter-spacing:.06em}#evc p{margin:0 0 10px;font-size:14px;line-height:1.4}#evc button{display:block;width:100%;margin:6px 0 0;padding:9px;font-size:14px;text-align:left}#evc button:disabled{opacity:.4}
#info{font-size:13px;line-height:1.5}#info button{font-size:14px;padding:3px 10px;margin-left:6px}
#bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:6px;padding:7px 4px;line-height:1.15;cursor:pointer}
button small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
button.on{border-color:var(--sig)}
button:focus-visible{outline:2px solid var(--air);outline-offset:2px}
#end{position:fixed;inset:0;background:rgba(20,26,36,.88);display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#end h1{font-size:40px;margin:0 0 6px}
#end p{font-size:20px;margin:0 0 16px;color:var(--mute)}
#end button{padding:10px 22px;background:var(--sig);color:#1d2430}
</style>
</head>

<style>
:root{--bg:#1d2430;--panel:#2a3342;--ink:#f1e6d6;--mute:#9aa6b8;--sig:#f2c14e;--air:#7fd1c7;--bad:#ff7a59;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#1d2430}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}
#hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st{background:var(--panel);border-radius:6px;padding:5px 6px;line-height:1.1}
.st b{display:block;font-size:20px;font-weight:700}
.st span{font-size:13px;color:var(--mute)}
#cv{width:100%;display:block;border-radius:6px;touch-action:none}
#msg{min-height:22px;font-size:17px;color:var(--sig)}
#row{display:flex;gap:6px;align-items:center}#row #msg{flex:1}#row button{font-size:15px;padding:4px 10px;white-space:nowrap}#ev{position:fixed;inset:0;background:rgba(5,8,16,.72);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}#evc{background:#141b2b;border:2px solid #f2c14e;border-radius:8px;padding:14px;max-width:360px;width:100%;color:#e8e4d8}#evc h3{margin:0 0 6px;color:#f2c14e;font-size:16px;letter-spacing:.06em}#evc p{margin:0 0 10px;font-size:14px;line-height:1.4}#evc button{display:block;width:100%;margin:6px 0 0;padding:9px;font-size:14px;text-align:left}#evc button:disabled{opacity:.4}
#info{font-size:13px;line-height:1.5}#info button{font-size:14px;padding:3px 10px;margin-left:6px}
#bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:6px;padding:7px 4px;line-height:1.15;cursor:pointer}
button small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
button.on{border-color:var(--sig)}
button:focus-visible{outline:2px solid var(--air);outline-offset:2px}
#end{position:fixed;inset:0;background:rgba(20,26,36,.88);display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#end h1{font-size:40px;margin:0 0 6px}
#end p{font-size:20px;margin:0 0 16px;color:var(--mute)}
#end button{padding:10px 22px;background:var(--sig);color:#1d2430}
</style>
</head>

  <div id="hud"></div>
  <canvas id="cv"></canvas>

</div>
