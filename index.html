<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Test — Web Audio brut</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#eee;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,520px);background:#1c1c1c;border:1px solid #383838;border-radius:16px;padding:22px}h1{font-size:22px;margin:0 0 8px}p{color:#aaa;line-height:1.45}.pick{display:block;margin:20px 0;padding:14px;border:1px dashed #777;border-radius:10px}input{max-width:100%}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{border:0;border-radius:9px;padding:12px 18px;background:#e5e5e5;color:#111;font-weight:700;font-size:15px}button:disabled{opacity:.35}#stop{background:#555;color:#fff}#status{margin-top:14px;color:#aaa;font-size:14px;overflow-wrap:anywhere}.note{font-size:13px;color:#888;border-top:1px solid #383838;padding-top:14px;margin-top:20px}
</style>
</head>
<body>
<main class="card">
<h1>Sample Test — Web Audio brut</h1>
<p>Cette version utilise Web Audio, mais sans aucun effet ni traitement : fichier décodé → lecteur → sortie audio.</p>
<label class="pick">Choisir un sample<br><input id="file" type="file" accept="audio/*"></label>
<div class="buttons"><button id="play" disabled>▶ Lire</button><button id="stop" disabled>■ Stop</button></div>
<div id="status">En attente d’un fichier.</div>
<div class="note">Test : prends exactement le même long sample qui grésillait dans l’application principale. Écoute-le jusqu’au bout, puis compare.</div>
</main>
<script>
const fileInput=document.querySelector('#file');
const playBtn=document.querySelector('#play');
const stopBtn=document.querySelector('#stop');
const status=document.querySelector('#status');
let ctx=null, buffer=null, source=null;
function stop(){if(source){try{source.stop()}catch(e){}try{source.disconnect()}catch(e){}source=null}stopBtn.disabled=true;playBtn.disabled=!buffer;}
fileInput.addEventListener('change',async()=>{
 stop();buffer=null;playBtn.disabled=true;stopBtn.disabled=true;
 const f=fileInput.files&&fileInput.files[0];if(!f)return;
 status.textContent='Décodage du sample…';
 try{
  if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')await ctx.resume();
  buffer=await ctx.decodeAudioData(await f.arrayBuffer());
  status.textContent=`${f.name} · ${(f.size/1024/1024).toFixed(2)} Mo · ${buffer.duration.toFixed(2)} s · ${buffer.sampleRate} Hz · ${buffer.numberOfChannels} canal/canaux`;
  playBtn.disabled=false;
 }catch(err){status.textContent='Erreur de décodage : '+err.message;}
});
playBtn.addEventListener('click',async()=>{
 if(!buffer)return;stop();
 try{
  if(ctx.state==='suspended')await ctx.resume();
  source=ctx.createBufferSource();source.buffer=buffer;source.connect(ctx.destination);
  source.onended=()=>{if(source){try{source.disconnect()}catch(e){}source=null}stopBtn.disabled=true;playBtn.disabled=false;};
  source.start();playBtn.disabled=true;stopBtn.disabled=false;
 }catch(err){status.textContent='Erreur de lecture : '+err.message;playBtn.disabled=false;}
});
stopBtn.addEventListener('click',stop);
</script>
</body>
</html>
